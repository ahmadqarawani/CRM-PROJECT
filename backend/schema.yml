  /api/v1/documents/{id}/file/:
    get:
      operationId: v1_documents_file_retrieve
      description: |-
        Auth is checked here; the bytes are sent by nginx (X-Accel-Redirect) in production.
        FileResponse under ASGI would read the whole file through Python.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا document.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/notifications/:
    get:
      operationId: v1_notifications_list
