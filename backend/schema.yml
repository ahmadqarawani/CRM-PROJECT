  /api/v1/requests/:
    get:
      operationId: v1_requests_list
      description: 'No DELETE by default: removal is archiving via PATCH {"is_archived":
        true}.'
      parameters:
      - in: query
        name: apartment
        schema:
          type: integer
      - in: query
        name: archived
        schema:
          type: boolean
      - in: query
        name: assignee
        schema:
          type: string
        description: user id or 'me'
      - in: query
        name: client
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - in: query
        name: overdue
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: stage
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - LOST
          - OPEN
          - WON
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequestList'
          description: ''
    post:
