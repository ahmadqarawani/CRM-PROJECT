openapi: 3.0.3
info:
  title: CRM API
  version: 1.0.0
paths:
  /api/v1/activities/:
    get:
      operationId: v1_activities_list
      description: 'Activities are a log: create and read only. "I contacted the client"
        is a POST here.'
      parameters:
      - in: query
        name: client
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: request
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
    post:
      operationId: v1_activities_create
      description: 'Activities are a log: create and read only. "I contacted the client"
        is a POST here.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
  /api/v1/apartments/:
    get:
      operationId: v1_apartments_list
      description: 'No DELETE by default: removal is archiving via PATCH {"is_archived":
        true}.'
      parameters:
      - in: query
        name: archived
        schema:
          type: boolean
      - in: query
        name: client
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
