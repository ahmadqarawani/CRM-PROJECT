components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        body:
          type: string
        client_id:
          type: integer
        request_id:
          type: integer
          nullable: true
        by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          readOnly: true
          nullable: true
        at:
          type: string
          format: date-time
      required:
      - by
      - client_id
      - id
      - type
    ActivityRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        body:
          type: string
        client_id:
          type: integer
        request_id:
          type: integer
          nullable: true
        at:
          type: string
          format: date-time
      required:
      - client_id
      - type
    Apartment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          allOf:
          - $ref: '#/components/schemas/ClientRef'
          readOnly: true
        title:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 300
        floor:
          type: string
          maxLength: 20
        area_m2:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        rooms:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        notes:
          type: string
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client
      - created_at
      - id
      - title
      - updated_at
    ApartmentRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
      required:
      - id
      - title
    ApartmentRefRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - title
    ApartmentRequest:
      type: object
      properties:
        client_id:
          type: integer
          writeOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 300
        floor:
          type: string
          maxLength: 20
        area_m2:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        rooms:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        notes:
          type: string
        is_archived:
          type: boolean
      required:
      - client_id
      - title
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - CONTRACT
      - QUOTE
      - PLAN
      - INVOICE
      - PHOTO
      - OTHER
      type: string
      description: |-
        * `CONTRACT` - عقد
        * `QUOTE` - عرض سعر
        * `PLAN` - مخطط
        * `INVOICE` - فاتورة
        * `PHOTO` - صور
        * `OTHER` - أخرى
    Client:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          nullable: true
          maxLength: 30
        whatsapp:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        city:
          type: string
          maxLength: 100
        source:
          type: string
          maxLength: 50
        tags:
          type: array
          items:
            type: string
            maxLength: 40
        notes:
          type: string
        last_contact_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        open_requests:
          type: integer
          readOnly: true
          default: 0
        has_overdue:
          type: boolean
          readOnly: true
          default: false
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - has_overdue
      - id
      - last_contact_at
      - name
      - open_requests
      - updated_at
    ClientRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
      required:
      - id
      - name
    ClientRefRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
    ClientRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          nullable: true
          maxLength: 30
        whatsapp:
          type: string
          maxLength: 30
        email:
          oneOf:
