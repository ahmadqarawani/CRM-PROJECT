      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApartmentList'
          description: ''
    post:
      operationId: v1_apartments_create
      description: 'No DELETE by default: removal is archiving via PATCH {"is_archived":
        true}.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApartmentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
          description: ''
  /api/v1/apartments/{id}/:
    get:
      operationId: v1_apartments_retrieve
      description: 'No DELETE by default: removal is archiving via PATCH {"is_archived":
        true}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا apartment.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
