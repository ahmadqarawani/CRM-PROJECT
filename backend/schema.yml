openapi: 3.0.3
info:
  title: CRM API
  version: 1.0.0
paths:
  /api/v1/activities/:
    get:
      operationId: v1_activities_list
      description: |-
        Role-based: `resource` names the permission group (contacts, deals…). Every query is limited to what the
        user may see (none / own / all); create/edit/delete need the matching permission (see apps.access).
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
      - in: query
        name: contact
        schema:
          type: integer
      - in: query
        name: deal
        schema:
          type: integer
      - in: query
        name: due
        schema:
          type: string
          enum:
          - overdue
          - today
          - week
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: planned
        schema:
          type: boolean
      - in: query
        name: property
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
    post:
      operationId: v1_activities_create
      description: |-
        Role-based: `resource` names the permission group (contacts, deals…). Every query is limited to what the
        user may see (none / own / all); create/edit/delete need the matching permission (see apps.access).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
  /api/v1/activities/{id}/:
    get:
      operationId: v1_activities_retrieve
      description: |-
        Role-based: `resource` names the permission group (contacts, deals…). Every query is limited to what the
        user may see (none / own / all); create/edit/delete need the matching permission (see apps.access).
      parameters:
      - in: path
        name: id
