components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/ActivityTypeEnum'
        subject:
          type: string
          maxLength: 200
        notes:
          type: string
        outcome:
          type: string
        contact:
          allOf:
          - $ref: '#/components/schemas/ContactRef'
          readOnly: true
        deal:
          allOf:
          - $ref: '#/components/schemas/DealMini'
          readOnly: true
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        done_at:
          type: string
          format: date-time
          nullable: true
        interest:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          readOnly: true
          nullable: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignee
      - contact
      - created_at
      - created_by
      - deal
      - id
      - type
    ActivityRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ActivityTypeEnum'
        subject:
          type: string
          maxLength: 200
        notes:
          type: string
        outcome:
          type: string
        contact_id:
          type: integer
          writeOnly: true
        deal_id:
          type: integer
          writeOnly: true
          nullable: true
        property_id:
          type: integer
          writeOnly: true
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        done_at:
          type: string
          format: date-time
          nullable: true
        interest:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        assignee_id:
          type: integer
          writeOnly: true
          nullable: true
        is_done:
          type: boolean
          writeOnly: true
        next_due:
          type: string
          format: date-time
          writeOnly: true
          nullable: true
        next_type:
          allOf:
          - $ref: '#/components/schemas/ActivityTypeEnum'
          writeOnly: true
        next_subject:
          type: string
          writeOnly: true
      required:
      - contact_id
      - type
    ActivityTypeEnum:
      enum:
      - CALL
      - WHATSAPP
      - MEETING
      - SITE_VISIT
      - VIEWING
      - TASK
      - NOTE
      - SYSTEM
      type: string
      description: |-
        * `CALL` - مكالمة
        * `WHATSAPP` - واتساب
        * `MEETING` - اجتماع / جلسة اتفاق
        * `SITE_VISIT` - معاينة
        * `VIEWING` - جولة على عقار
        * `TASK` - مهمة
        * `NOTE` - ملاحظة
        * `SYSTEM` - النظام
    AppliesToEnum:
      enum:
      - ALL
      - FINISHING
      - BROKERAGE
      type: string
      description: |-
        * `ALL` - الكل
        * `FINISHING` - الإكساء
        * `BROKERAGE` - الوساطة
    BlankEnum:
      enum:
      - ''
    BuildingStateEnum:
      enum:
      - UNDER_CONSTRUCTION
      - NEW
      - USED
      type: string
      description: |-
        * `UNDER_CONSTRUCTION` - قيد الإنشاء
        * `NEW` - جديد
        * `USED` - مستخدم
    CategoryEnum:
      enum:
      - PHOTO
      - PLAN
      - QUOTE
      - CONTRACT
      - INVOICE
      - OWNERSHIP
      - OTHER
      type: string
      description: |-
        * `PHOTO` - صور
        * `PLAN` - مخطط
        * `QUOTE` - دراسة / عرض سعر
        * `CONTRACT` - عقد
        * `INVOICE` - فاتورة / إيصال
        * `OWNERSHIP` - أوراق ملكية
        * `OTHER` - أخرى
    CompleteActivityRequest:
      type: object
      properties:
        outcome:
          type: string
          minLength: 1
        interest:
          type: integer
        next_due:
          type: string
          format: date-time
        next_type:
          type: string
          minLength: 1
    Contact:
      type: object
      description: 'Adds `access: {edit, delete}` — what the current user may do with
        this record (role + own/all scope).'
      properties:
        id:
          type: integer
          readOnly: true
        access:
          type: object
          additionalProperties: {}
          readOnly: true
        name:
          type: string
          maxLength: 200
        display_name:
          type: string
          readOnly: true
        phones:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
        source:
          allOf:
          - $ref: '#/components/schemas/SourceRef'
          readOnly: true
          nullable: true
        referred_by:
          type: string
          maxLength: 200
        assignee:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          readOnly: true
          nullable: true
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
          readOnly: true
        last_contact_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        open_deals:
          type: integer
          readOnly: true
          default: 0
        properties_count:
          type: integer
          readOnly: true
          default: 0
        needs_attention:
          type: boolean
          readOnly: true
          default: false
        merged_into:
          type: integer
          readOnly: true
          nullable: true
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - access
      - assignee
      - created_at
      - display_name
      - id
      - last_contact_at
      - merged_into
      - needs_attention
      - open_deals
      - properties_count
      - source
      - tags
      - updated_at
    ContactRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    ContactRequest:
      type: object
      description: 'Adds `access: {edit, delete}` — what the current user may do with
        this record (role + own/all scope).'
      properties:
        name:
          type: string
          maxLength: 200
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneRequest'
        source_id:
          type: integer
          writeOnly: true
          nullable: true
        referred_by:
          type: string
          maxLength: 200
        assignee_id:
          type: integer
          writeOnly: true
          nullable: true
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        notes:
          type: string
        tag_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        is_archived:
          type: boolean
    Deal:
      type: object
      description: 'Adds `access: {edit, delete}` — what the current user may do with
        this record (role + own/all scope).'
      properties:
        id:
          type: integer
          readOnly: true
        access:
          type: object
          additionalProperties: {}
          readOnly: true
        kind:
          $ref: '#/components/schemas/DealKindEnum'
        pipeline:
