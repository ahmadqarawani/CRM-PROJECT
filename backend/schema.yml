  /api/v1/tasks/:
    get:
      operationId: v1_tasks_list
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: user id or 'me'
      - in: query
        name: client
        schema:
          type: integer
      - in: query
        name: done
        schema:
          type: boolean
      - in: query
        name: due
        schema:
          type: string
          enum:
          - overdue
          - today
          - week
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: request
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskList'
          description: ''
    post:
      operationId: v1_tasks_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{id}/:
    get:
      operationId: v1_tasks_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا task.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: v1_tasks_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا task.
