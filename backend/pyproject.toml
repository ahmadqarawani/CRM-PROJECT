[project]
name = "crm-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "django-auditlog>=3.4.1",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "granian>=2.8.7",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.43",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-ignore = ["RUF012"]  # Django Meta / DRF class attributes are idiomatic lists

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC"]  # e2e driver: blocking calls are deliberate
