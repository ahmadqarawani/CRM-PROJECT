# Tool settings only. Dependencies: requirements.txt (runtime) and requirements-dev.txt (tests, lint).

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-ignore = ["RUF012"]  # Django Meta / DRF class attributes are idiomatic lists
